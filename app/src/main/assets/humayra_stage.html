<!DOCTYPE html>
<html><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}canvas{display:block;width:100%;height:100%;touch-action:none}</style>
</head><body>
<script src="js/three.min.js"></script><script src="js/GLTFLoader.js"></script>
<script src="js/OrbitControls.js"></script><script src="js/three-vrm.min.js"></script>
<script>
let accentHex='#60A5FA',pose='stand',portrait=false,speaking=false,hasWp=false,loadToken=0,dragging=false,springBack=false,snapTimer=null;
const scene=new THREE.Scene(); scene.background=new THREE.Color('#000000');
const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,0.05,50);
camera.position.set(0,1.15,2.75);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding; document.body.appendChild(renderer.domElement);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.target.set(0,0.92,0); controls.enableDamping=true; controls.minDistance=0.55; controls.maxDistance=5;
controls.minPolarAngle=0.3; controls.maxPolarAngle=Math.PI*0.54;
let camGoal=new THREE.Vector3(0,1.15,2.75),tgtGoal=new THREE.Vector3(0,0.92,0);
controls.addEventListener('start',()=>{dragging=true;springBack=false;clearTimeout(snapTimer);});
controls.addEventListener('end',()=>{dragging=false;clearTimeout(snapTimer);snapTimer=setTimeout(()=>{springBack=true;},1500);});
scene.add(new THREE.HemisphereLight(0xdbeafe,0x0f172a,1.05));
const dir=new THREE.DirectionalLight(0xffffff,1.3); dir.position.set(1.2,2.4,2); scene.add(dir);
const rim=new THREE.PointLight(accentHex,2.1,8); rim.position.set(-1.3,1.6,-1.2); scene.add(rim);
const pad=new THREE.Mesh(new THREE.RingGeometry(0.55,0.61,64),new THREE.MeshBasicMaterial({color:accentHex,side:THREE.DoubleSide,transparent:true,opacity:0.55}));
pad.rotation.x=-Math.PI/2; pad.position.y=0.01; scene.add(pad);
const fbRoot=new THREE.Group(); scene.add(fbRoot);
const bodyMat=new THREE.MeshStandardMaterial({color:0x111827,metalness:0.55,roughness:0.3});
const glowMat=new THREE.MeshBasicMaterial({color:accentHex});
const skinMat=new THREE.MeshStandardMaterial({color:0x1e293b,metalness:0.25,roughness:0.45});
const fb={torso:new THREE.Group(),head:new THREE.Group(),lArm:new THREE.Group(),rArm:new THREE.Group(),lLeg:new THREE.Group(),rLeg:new THREE.Group()};
fb.torso.position.y=0.86; fbRoot.add(fb.torso);
const chest=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.11,0.46,20),bodyMat); chest.position.y=0.22; fb.torso.add(chest);
const core=new THREE.Mesh(new THREE.OctahedronGeometry(0.055),glowMat); core.position.set(0,0.28,0.12); fb.torso.add(core);
fb.head.position.y=0.56; fb.torso.add(fb.head); fb.head.add(new THREE.Mesh(new THREE.SphereGeometry(0.14,24,24),skinMat));
const lEye=new THREE.Mesh(new THREE.BoxGeometry(0.04,0.015,0.02),glowMat); lEye.position.set(-0.044,0.02,0.13);
const rEye=lEye.clone(); rEye.position.x=0.044; fb.head.add(lEye,rEye);
const mouth=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.012,0.02),glowMat); mouth.position.set(0,-0.05,0.13); fb.head.add(mouth);
const halo=new THREE.Mesh(new THREE.TorusGeometry(0.21,0.007,10,48),glowMat); halo.position.set(0,0.14,-0.04); fb.head.add(halo);
function limb(g,x,y,r,h){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r*0.78,h,14),bodyMat);m.position.y=-h/2;g.position.set(x,y,0);g.add(m);return g;}
fb.torso.add(limb(fb.lArm,-0.20,0.42,0.04,0.45),limb(fb.rArm,0.20,0.42,0.04,0.45));
fbRoot.add(limb(fb.lLeg,-0.085,0.78,0.05,0.76),limb(fb.rLeg,0.085,0.78,0.05,0.76));
let vrm=null,customObj=null,mixer=null,hipBaseY=0;
function clearCustom(){if(customObj){scene.remove(customObj);customObj=null;}vrm=null;mixer=null;}
window.loadModel=function(url){
  const tok=++loadToken; const loader=new THREE.GLTFLoader();
  if(window.THREE_VRM&&THREE_VRM.VRMLoaderPlugin) loader.register(p=>new THREE_VRM.VRMLoaderPlugin(p));
  loader.load(url,gltf=>{
    if(tok!==loadToken) return; clearCustom(); fbRoot.visible=false;
    vrm=gltf.userData&&gltf.userData.vrm?gltf.userData.vrm:null;
    if(vrm&&THREE_VRM.VRMUtils) THREE_VRM.VRMUtils.rotateVRM0(vrm);
    const obj=vrm?vrm.scene:gltf.scene;
    const box=new THREE.Box3().setFromObject(obj); const sz=new THREE.Vector3(); box.getSize(sz);
    obj.scale.setScalar(1.62/Math.max(sz.y,0.01));
    const nb=new THREE.Box3().setFromObject(obj); const ctr=new THREE.Vector3(); nb.getCenter(ctr);
    obj.position.set(-ctr.x,-nb.min.y,-ctr.z);
    if(vrm){const h=vb('hips');hipBaseY=h?h.position.y:0;}
    if(!vrm&&gltf.animations&&gltf.animations.length){mixer=new THREE.AnimationMixer(obj);mixer.clipAction(gltf.animations[0]).play();}
    customObj=obj; scene.add(obj);
  },undefined,()=>{if(tok===loadToken){clearCustom();fbRoot.visible=true;}});
};
function vb(n){try{return vrm&&vrm.humanoid?vrm.humanoid.getNormalizedBoneNode(n):null;}catch(e){return null;}}
window.setPose=function(p){if(p==='portrait'){portrait=!portrait;springBack=true;if(portrait){camGoal.set(0,1.48,0.9);tgtGoal.set(0,1.45,0);}else{camGoal.set(0,1.15,2.75);tgtGoal.set(0,0.92,0);}}else{pose=p;}};
window.setTheme=function(bg,acc){if(!hasWp)scene.background=new THREE.Color(bg);rim.color.set(acc);pad.material.color.set(acc);glowMat.color.set(acc);};
window.setWallpaper=function(on){hasWp=!!on;scene.background=hasWp?null:new THREE.Color('#000000');renderer.setClearColor(0x000000,hasWp?0:1);};
window.setSpeaking=function(s){speaking=!!s;};
window.resetFallback=function(){++loadToken;clearCustom();fbRoot.visible=true;};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
const clock=new THREE.Clock();
(function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),0.05),t=clock.elapsedTime;
  const blink=(t%3.6)>3.46?1:0,mouthOpen=speaking?(0.25+Math.abs(Math.sin(t*15))*0.75):0;
  if(springBack&&!dragging){
    camera.position.lerp(camGoal,0.06); controls.target.lerp(tgtGoal,0.06);
    if(camera.position.distanceTo(camGoal)<0.015) springBack=false;
  }
  const idleSway=Math.sin(t*0.65)*0.03,idleNod=Math.sin(t*1.1)*0.025,microSmile=(t%14)>11.5?0.45:0;
  if(fbRoot.visible){
    const sit=pose==='sit'; fb.torso.position.y=THREE.MathUtils.lerp(fb.torso.position.y,(sit?0.48:0.86)+Math.sin(t*2.1)*0.012,0.1);
    fb.torso.rotation.z=idleSway*0.6; fb.lLeg.position.y=fb.rLeg.position.y=sit?0.44:0.78;
    fb.lLeg.rotation.x=fb.rLeg.rotation.x=THREE.MathUtils.lerp(fb.lLeg.rotation.x,sit?-1.35:0,0.1);
    fb.rArm.rotation.z=pose==='wave'?2.3+Math.sin(t*7)*0.32:0.08+Math.sin(t*1.3)*0.04; fb.lArm.rotation.z=-0.08-Math.sin(t*1.3)*0.04;
    fb.head.rotation.y=Math.sin(t*0.7)*0.12; fb.head.rotation.x=idleNod; lEye.scale.y=rEye.scale.y=blink?0.1:1; mouth.scale.y=1+mouthOpen*2.5; halo.rotation.z=t*0.7;
  }
  if(vrm){
    const em=vrm.expressionManager; if(em){em.setValue('blink',blink);em.setValue('aa',mouthOpen);em.setValue('happy',pose==='smile'||pose==='wave'?0.75:microSmile);}
    const la=vb('leftUpperArm'),ra=vb('rightUpperArm'),lfa=vb('leftLowerArm'),rfa=vb('rightLowerArm'),hd=vb('head'),sp=vb('spine'),hp=vb('hips'),ll=vb('leftUpperLeg'),rl=vb('rightUpperLeg'),lk=vb('leftLowerLeg'),rk=vb('rightLowerLeg');
    const sit=pose==='sit',wv=pose==='wave';
    if(la){la.rotation.z=1.22+Math.sin(t*1.2)*0.03;la.rotation.x=Math.sin(t*0.9)*0.04;}
    if(lfa){lfa.rotation.z=sit?0.35:0.12;lfa.rotation.x=sit?-0.45:-0.12;}
    if(ra){ra.rotation.z=wv?0.38:-1.22-Math.sin(t*1.2)*0.03;ra.rotation.x=wv?-0.35:(sit?-0.2:Math.cos(t*0.9)*0.04);}
    if(rfa){rfa.rotation.z=wv?1.45+Math.sin(t*7)*0.35:-0.12;rfa.rotation.x=sit?-0.45:-0.12;}
    if(hd){hd.rotation.y=Math.sin(t*0.55)*0.14;hd.rotation.x=idleNod;hd.rotation.z=Math.sin(t*0.4)*0.04;}
    if(sp){sp.rotation.x=sit?0.09:Math.sin(t*1.8)*0.025;sp.rotation.z=idleSway;}
    if(hp){hp.position.y=hipBaseY-(sit?0.42:0)+Math.sin(t*2)*0.008;hp.position.x=idleSway*0.35;hp.rotation.y=Math.sin(t*0.5)*0.05;}
    if(ll)ll.rotation.x=sit?-1.28:0; if(rl)rl.rotation.x=sit?-1.28:0; if(lk)lk.rotation.x=sit?1.35:0; if(rk)rk.rotation.x=sit?1.35:0;
    vrm.update(dt);
  }
  if(mixer)mixer.update(dt); controls.update(); renderer.render(scene,camera);
})();
</script></body></html>
